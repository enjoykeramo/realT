name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test :app:installDist --no-daemon
      - name: Demo smoke run
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/app/build/install/realt/bin/realt" demo
          test -s realt-demo-out/report.md
